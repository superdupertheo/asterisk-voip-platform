---
- name: Create Asterisk persistent data directory
  ansible.builtin.file:
    path: /srv/asterisk-data
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0770"

- name: Configure SELinux context for Asterisk data
  ansible.builtin.command:
    cmd: semanage fcontext -a -t container_file_t "/srv/asterisk-data(/.*)?"
  register: asterisk_selinux_context
  changed_when: asterisk_selinux_context.rc == 0
  failed_when:
    - asterisk_selinux_context.rc != 0
    - "'already defined' not in asterisk_selinux_context.stderr"

- name: Restore SELinux context on Asterisk data
  ansible.builtin.command:
    cmd: restorecon -Rv /srv/asterisk-data
  changed_when: false
