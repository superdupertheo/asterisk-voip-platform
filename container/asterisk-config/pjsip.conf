[global]
type=global
user_agent=Asterisk-VoIP-Platform

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=REPLACE_WITH_STRONG_PASSWORD

[1001-aor]
type=aor
max_contacts=2
remove_existing=yes

[1001]
type=endpoint
context=internal
disallow=all
allow=ulaw
auth=1001-auth
aors=1001-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[1002-auth]
type=auth
auth_type=userpass
username=1002
password=REPLACE_WITH_ANOTHER_STRONG_PASSWORD

[1002-aor]
type=aor
max_contacts=2
remove_existing=yes

[1002]
type=endpoint
context=internal
disallow=all
allow=ulaw
auth=1002-auth
aors=1002-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
